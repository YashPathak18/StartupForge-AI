spring:
  application:
    name: auth-service
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.startupforge.auth: DEBUG
    org.springframework.security: INFO
